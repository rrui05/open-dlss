<!doctype html><meta charset="utf-8"><title>OpenDLSS identical-features cross-check</title>
<pre id="status">Loading...</pre><canvas id="input" hidden></canvas><canvas id="output"></canvas>
<script type="module">
import { Network } from '/open-dlss/ports/browser-webgpu/src/network.js';
import { readBack } from '/open-dlss/ports/browser-webgpu/src/gpu.js';
import { composeImage } from '/open-dlss/ports/browser-webgpu/src/parity.js';
let network, objectUrl, deviceLoss = null;
const gpuErrors = [];
const evidence={status:'running',started_at_utc:new Date().toISOString(),method:{purpose:'Isolate preprocessing differences from graph arithmetic using identical saved sixteen-lane native features. No full speed benchmark; one cold and two further calls.',backend:'Original unmodified WebGPU graph; original composeImage with feature-fixture centering.'}};
const post=async(path,value)=>{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(value)});if(!r.ok)throw new Error(`${path}: ${r.status} ${await r.text()}`);};
const progress=async stage=>{evidence.stage=stage;document.querySelector('#status').textContent=stage;await post('/progress',{stage,status:'running'});};
const hash=async array=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',array))].map(x=>x.toString(16).padStart(2,'0')).join('');
const base64=bytes=>{let s='';for(let at=0;at<bytes.length;at+=32768)s+=String.fromCharCode(...bytes.subarray(at,at+32768));return btoa(s);};
const fetchBytes=async path=>{const response=await fetch(path);if(!response.ok)throw new Error(`${path}: ${response.status} ${await response.text()}`);return response.arrayBuffer();};
function compare(a,b){
 if(a.length!==b.length)throw new Error('Mismatched tensor lengths');
 const aa=new Uint32Array(a.buffer,a.byteOffset,a.length),bb=new Uint32Array(b.buffer,b.byteOffset,b.length);
 let mismatches=0,absolute=0,squared=0,maximum=0,nonfinite=0;
 for(let i=0;i<a.length;i++){if(aa[i]!==bb[i])mismatches++;if(!Number.isFinite(a[i])||!Number.isFinite(b[i])){nonfinite++;continue;}const d=Math.abs(a[i]-b[i]);absolute+=d;squared+=d*d;maximum=Math.max(maximum,d);}
 return {elements:a.length,bitwise_mismatches:mismatches,bitwise_equal:mismatches===0,mae:absolute/a.length,rmse:Math.sqrt(squared/a.length),max_abs:maximum,nonfinite};
}
try{
 const config=await(await fetch('/config')).json();evidence.configuration={width:config.width,height:config.height,batch_size:1,cold_calls:1,additional_calls:2};
 const imageBytes=new Uint8Array(await fetchBytes(config.image));
 objectUrl=URL.createObjectURL(new Blob([imageBytes],{type:'image/png'}));const source=new Image();source.src=objectUrl;await source.decode();
 if(source.naturalWidth!==config.width||source.naturalHeight!==config.height)throw new Error('Input dimensions differ');
 const input=document.querySelector('#input');input.width=config.width;input.height=config.height;input.getContext('2d').drawImage(source,0,0);
 const rgba=input.getContext('2d').getImageData(0,0,config.width,config.height),proxy=Float32Array.from(rgba.data,x=>x/255);
 const featureBytes=await fetchBytes('/inputs/native_features.f32');
 const nativeFeatures=new Float32Array(featureBytes);
 const nativeHead=new Float32Array(await fetchBytes('/inputs/native_head.f32'));
 const expectedFeatures=config.width*config.height*16;if(nativeFeatures.length!==expectedFeatures)throw new Error('Bad feature size');
 evidence.input={rgb_sha256:await hash(imageBytes),native_features_sha256:await hash(featureBytes),native_head_sha256:await hash(nativeHead.buffer)};
 await progress('creating original WebGPU graph');network=await Network.create({weights:'/weights',width:config.width,height:config.height});
 evidence.environment={adapter_info:Object.fromEntries(['vendor','architecture','isFallbackAdapter'].map(k=>[k,network.adapterInfo?.[k]??null])),features:[...network.device.features],user_agent:navigator.userAgent};
 if(network.adapterInfo?.isFallbackAdapter===true)throw new Error('Software fallback adapter is not a valid GPU cross-check');
 network.device.addEventListener('uncapturederror',event=>gpuErrors.push(`${event.error.constructor.name}: ${event.error.message}`));
 network.device.lost.then(info=>{deviceLoss={reason:info.reason,message:info.message};});
 evidence.model={learned_blocks:network.model.blockCount,graph_dispatches:network.recorder.dispatchCount};
 if(network.model.blockCount!==71)throw new Error(`Expected 71 blocks, received ${network.model.blockCount}`);
 if(network.geometry.fullWidth!==config.width||network.geometry.fullHeight!==config.height)throw new Error('cross.html requires dimensions accepted without geometry padding');
 if(nativeHead.length!==config.width*config.height*4)throw new Error('Bad native head size');
 await progress('comparing independent preprocess tensors');
 await network.featuresFromProxy(proxy,{proxy:{width:config.width,height:config.height},seed:0,autoMask:true,conditioning:{localTone:1,localStructure:1,skinStructure:-1,style:0}});
 const webFeatures=new Float32Array(await readBack(network.device,network.features.buffer,expectedFeatures*4));
 const webBits=new Uint32Array(webFeatures.buffer),nativeBits=new Uint32Array(nativeFeatures.buffer);
 evidence.preprocessing_comparison={whole_tensor:compare(webFeatures,nativeFeatures),webgpu_features_sha256:await hash(webFeatures.buffer),per_lane:[]};
 for(let lane=0;lane<16;lane++){
   let mismatches=0,max=0,sum=0;for(let i=lane;i<webFeatures.length;i+=16){mismatches+=Number(webBits[i]!==nativeBits[i]);const delta=Math.abs(webFeatures[i]-nativeFeatures[i]);sum+=delta;max=Math.max(max,delta);}
   evidence.preprocessing_comparison.per_lane.push({lane,pixels:config.width*config.height,bitwise_mismatches:mismatches,mae:sum/(config.width*config.height),max_abs:max});
 }
 await progress('uploading identical sixteen-lane native features');
 network.writeFeatures(nativeFeatures);await network.device.queue.onSubmittedWorkDone();
 const calls=[];let coldHead,lastHead;
 for(let i=0;i<3;i++){
   await progress(`same-feature graph call ${i+1}/3`);const start=performance.now();await network.run();calls.push(performance.now()-start);
   lastHead=await network.readHead();if(i===0)coldHead=lastHead;
 }
 evidence.graph_calls_synchronized_wall_ms=calls;
 evidence.head_validation={all_finite:[...lastHead].every(Number.isFinite),shape:[network.geometry.fullHeight,network.geometry.fullWidth,4]};
 if(!evidence.head_validation.all_finite)throw new Error('Nonfinite WebGPU head');
 evidence.same_feature_native_head_comparison=compare(lastHead,nativeHead);
 evidence.same_feature_repeated_webgpu_comparison=compare(lastHead,coldHead);
 if(evidence.same_feature_native_head_comparison.nonfinite||evidence.preprocessing_comparison.whole_tensor.nonfinite)throw new Error('Nonfinite cross-check tensors');
 if(!evidence.same_feature_repeated_webgpu_comparison.bitwise_equal)throw new Error('Repeated identical-feature WebGPU graph differs');
 const composed=composeImage(lastHead,{features:nativeFeatures},network.geometry);
 const output=document.querySelector('#output');output.width=config.width;output.height=config.height;output.getContext('2d').putImageData(composed,0,0);
 if(gpuErrors.length)throw new Error(`Uncaptured WebGPU errors: ${gpuErrors.join('; ')}`);
 if(deviceLoss)throw new Error(`WebGPU device lost: ${deviceLoss.reason}: ${deviceLoss.message}`);
 evidence.gpu_errors=gpuErrors;
 evidence.status='completed';evidence.stage='complete';evidence.finished_at_utc=new Date().toISOString();
 await post('/result',{...evidence,pngBase64:output.toDataURL('image/png').split(',')[1],inputPngBase64:input.toDataURL('image/png').split(',')[1],headBase64:base64(new Uint8Array(lastHead.buffer,lastHead.byteOffset,lastHead.byteLength))});
 document.querySelector('#status').textContent=JSON.stringify(evidence,null,2);
}catch(error){evidence.status='failed';evidence.gpu_errors=gpuErrors;evidence.error={type:error.constructor.name,message:error.message,traceback:error.stack};try{await post('/result',evidence);}catch(e){console.error(e);}}
finally{network?.destroy();if(objectUrl)URL.revokeObjectURL(objectUrl);}
</script>
